<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RISHITA 🌷</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      animation: fadeIn 1.2s ease;
      z-index: 2;
    }

    h1 {
      color: #ff5e7e;
      margin-bottom: 10px;
    }

    p {
      color: #444;
      font-size: 16px;
      line-height: 1.6;
    }

    button {
      margin-top: 15px;
      padding: 12px 25px;
      border: none;
      border-radius: 30px;
      background: #ff5e7e;
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .hidden {
      display: none;
      margin-top: 20px;
      color: #ff5e7e;
      font-weight: 600;
    }

    .heart {
      position: absolute;
      bottom: -10px;
      font-size: 18px;
      animation: floatUp 6s linear infinite;
      opacity: 0.7;
      z-index: 1;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0);
        opacity: 0.8;
      }
      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <!-- 🎵 Background Music (GitHub Pages Safe) -->
  <audio id="bgMusic" loop preload="auto">
    <source src="./chaudhary.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <div class="card">
    <h1>Rishita 🌷</h1>

    <p>
      I know today feels a little off…  
      so I made this tiny space just for you.
      <br><br>
      Take a deep breath ✨  
      You’re safe here.
    </p>

    <button onclick="startMusic()">Play music 🎵</button>
    <button onclick="showMessage()">Tap for a smile 💕</button>

    <div id="surprise" class="hidden">
      Even on quiet days…  
      you’re still someone’s favorite thought ❤️
    </div>
  </div>

  <script>
    // REQUIRED for mobile browsers
    document.body.addEventListener("click", () => {
      const music = document.getElementById("bgMusic");
      if (music.paused) {
        music.volume = 0.35;
        music.play().catch(() => {});
      }
    }, { once: true });

    function startMusic() {
      const music = document.getElementById("bgMusic");
      music.volume = 0.35;
      music.currentTime = 0;
      music.play().catch(() => {
        alert("Tap anywhere once, then tap Play 🎵");
      });
    }

    function showMessage() {
      document.getElementById("surprise").style.display = "block";
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }

    setInterval(createHeart, 600);
  </script>

</body>
</html>
